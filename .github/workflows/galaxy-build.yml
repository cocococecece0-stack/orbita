name: ORBITA Galaxy Build

on:
  push:
    tags:
      - "g*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Необязательный g* тег для публикации бинарников (пусто = только артефакты)"
        required: false
        default: ""

concurrency:
  group: galaxy-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 2022.3.74f1 is Extended LTS (Unity Industry/Enterprise only).
  # 2022.3.62f1 is the last public 2022.3 LTS usable with Unity Personal.
  UNITY_VERSION: "2022.3.62f1"
  ANDROID_APK: "OrbitaGalaxy-Android.apk"
  IOS_IPA: "OrbitaGalaxy-iOS-Unsigned.ipa"
  BUNDLE_ID: "com.orbit.galaxy"
  BUNDLE_VERSION: "4.1.0"
  ANDROID_VERSION_CODE: "4100"
  IOS_MIN_VERSION: "13.0"

jobs:
  credentials:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Detect Unity credentials
        id: check
        env:
          HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          HAS_UNITY_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
        run: |
          echo "UNITY_LICENSE: $([ "$HAS_UNITY_LICENSE" = true ] && echo present || echo missing)"
          echo "UNITY_EMAIL: $([ "$HAS_UNITY_EMAIL" = true ] && echo present || echo missing)"
          echo "UNITY_PASSWORD: $([ "$HAS_UNITY_PASSWORD" = true ] && echo present || echo missing)"
          echo "UNITY_SERIAL: $([ "$HAS_UNITY_SERIAL" = true ] && echo present || echo missing)"

          if { [ "$HAS_UNITY_LICENSE" = true ] && [ "$HAS_UNITY_EMAIL" = true ] && [ "$HAS_UNITY_PASSWORD" = true ]; } \
            || { [ "$HAS_UNITY_SERIAL" = true ] && [ "$HAS_UNITY_EMAIL" = true ] && [ "$HAS_UNITY_PASSWORD" = true ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity credentials detected."
          else
            echo "::error::Incomplete Unity activation secrets. For Personal provide UNITY_LICENSE plus UNITY_EMAIL and UNITY_PASSWORD. GameCI extracts the serial from .ulf but still authenticates with the Unity account during activation."
            echo "Add the missing values in Settings -> Secrets and variables -> Actions. Do not paste secrets into Issues or logs."
            echo "This workflow will not simulate a license or publish a fake successful build."
            exit 1
          fi

  tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Galaxy core tests
        run: dotnet test unity/Tests/Galaxy/Orbit.Galaxy.Core.Tests.csproj --configuration Release --nologo

      - name: Legacy core regression
        run: dotnet test unity/Tests/Orbit.Core.Tests.csproj --configuration Release --nologo

  android:
    name: Android APK
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: ${{ runner.os }}-unity-galaxy-library-${{ hashFiles('unity/Assets/**','unity/Packages/**','unity/ProjectSettings/**') }}
          restore-keys: |
            ${{ runner.os }}-unity-galaxy-library-

      - name: Pin editor version for Unity Personal
        shell: bash
        run: |
          set -euo pipefail
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > unity/ProjectSettings/ProjectVersion.txt
          cat unity/ProjectSettings/ProjectVersion.txt
          echo "CI uses Unity $UNITY_VERSION: 2022.3.74f1 is Extended LTS and cannot be activated with Unity Personal."

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Orbit.Galaxy.Editor.GalaxyBuildScript.BuildAndroid
          allowDirtyBuild: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="unity/build/GalaxyAndroid/${ANDROID_APK}"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi

          unzip -tq "$APK" >/dev/null
          APK_ENTRIES="$(unzip -l "$APK")"
          for entry in AndroidManifest.xml classes.dex; do
            if [[ "$APK_ENTRIES" != *"$entry"* ]]; then
              echo "::error::APK is missing $entry"
              exit 1
            fi
          done
          if [[ "$APK_ENTRIES" != *"lib/arm64-v8a/"* ]]; then
            echo "::error::APK has no arm64-v8a native libraries; ARM64 target was not applied"
            exit 1
          fi

          AAPT=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$root" ] || continue
            candidate="$(find "$root/build-tools" -type f \( -name aapt -o -name aapt2 \) 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$candidate" ]; then
              AAPT="$candidate"
              break
            fi
          done
          if [ -z "$AAPT" ]; then
            echo "::error::Android SDK aapt/aapt2 was not found; cannot verify APK identity"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK" 2>/dev/null || true)"
          if [ -z "$BADGING" ]; then
            echo "::error::$AAPT could not read $APK"
            exit 1
          fi

          check_badging() {
            local description="$1"
            local expected="$2"
            # Literal substring check: grep -q under pipefail can fail spuriously
            # when it exits before printf has written all of the badging output.
            if [[ "$BADGING" != *"$expected"* ]]; then
              echo "::error::APK $description does not match required value ($expected)"
              echo "----- aapt badging -----"
              printf '%s\n' "$BADGING"
              echo "------------------------"
              exit 1
            fi
          }
          check_badging "package id" "name='$BUNDLE_ID'"
          check_badging "version name" "versionName='$BUNDLE_VERSION'"
          check_badging "version code" "versionCode='$ANDROID_VERSION_CODE'"
          # aapt prints sdkVersion:'23', aapt2 prints minSdkVersion:'23'.
          if [[ "$BADGING" != *"sdkVersion:'23'"* && "$BADGING" != *"minSdkVersion:'23'"* ]]; then
            echo "::error::APK minimum SDK does not match required value (23)"
            echo "----- aapt badging -----"
            printf '%s\n' "$BADGING"
            echo "------------------------"
            exit 1
          fi
          check_badging "landscape orientation" "android.hardware.screen.landscape"

          TREE="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null || true)"
          ORIENTATION="$(printf '%s\n' "$TREE" | grep -A1 'screenOrientation' | tail -n 1 || true)"

          echo "APK verified with $AAPT: $APK"
          echo "Bundle: $BUNDLE_ID $BUNDLE_VERSION ($ANDROID_VERSION_CODE), minSdk 23, arm64-v8a"
          echo "Manifest orientation: ${ORIENTATION:-not reported by aapt}"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbita-galaxy-android
          path: unity/build/GalaxyAndroid/${{ env.ANDROID_APK }}
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS Unsigned IPA
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    # GameCI v4 still calls the legacy Unity Hub headless CLI, removed in Hub 4.x.
    # Pin macOS 15/arm64 so the Hub 3.x installer below can be used.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity Hub 3.x
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Expected an arm64 macOS runner for the pinned Unity Hub 3.x installer"
            exit 1
          fi
          HUB_VERSION="3.22.5"
          DMG="UnityHubSetup-${HUB_VERSION}-arm64.dmg"
          URL="https://public-cdn.cloud.unity3d.com/hub/prod/${HUB_VERSION}/${DMG}"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/$DMG"
          MOUNT="$RUNNER_TEMP/unity-hub-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$RUNNER_TEMP/$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          APP="$(find "$MOUNT" -maxdepth 2 -type d -name 'Unity Hub.app' -print -quit 2>/dev/null)"
          if [ -z "$APP" ]; then
            echo "::error::Unity Hub 3.x app not found in $DMG"
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi
          rm -rf "/Applications/Unity Hub.app"
          cp -R "$APP" "/Applications/Unity Hub.app"
          hdiutil detach "$MOUNT" -quiet
          test -x "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
          echo "Installed Unity Hub $HUB_VERSION at /Applications/Unity Hub.app"

      # Do not restore a cached Library here. Unity 2022.3's Package Manager can
      # crash ("async hook stack has become corrupted") when it resumes a cached
      # resolved-package state on macOS arm64; a clean Library built reliably.
      - name: Pin editor version for Unity Personal
        shell: bash
        run: |
          set -euo pipefail
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > unity/ProjectSettings/ProjectVersion.txt
          cat unity/ProjectSettings/ProjectVersion.txt
          echo "CI uses Unity $UNITY_VERSION: 2022.3.74f1 is Extended LTS and cannot be activated with Unity Personal."

      - name: Build iOS Xcode project
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Orbit.Galaxy.Editor.GalaxyBuildScript.BuildIOS
          allowDirtyBuild: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          for tool in xcodebuild plutil lipo file otool unzip zip codesign; do
            command -v "$tool" >/dev/null || { echo "::error::Missing tool: $tool"; exit 1; }
          done
          xcodebuild -version

          XCODE_DIR="unity/build/GalaxyiOS"
          find "$XCODE_DIR" -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod u+x {} + 2>/dev/null || true

          if [ -f "$XCODE_DIR/Unity-iPhone.xcworkspace/contents.xcworkspacedata" ]; then
            XC_ARGS=(-workspace "$XCODE_DIR/Unity-iPhone.xcworkspace")
          elif [ -d "$XCODE_DIR/Unity-iPhone.xcodeproj" ]; then
            XC_ARGS=(-project "$XCODE_DIR/Unity-iPhone.xcodeproj")
          else
            PROJECT="$(find "$XCODE_DIR" -maxdepth 2 -type d -name '*.xcodeproj' 2>/dev/null | head -n 1)"
            if [ -z "$PROJECT" ]; then
              echo "::error::Unity did not produce an Xcode project under $XCODE_DIR"
              exit 1
            fi
            XC_ARGS=(-project "$PROJECT")
          fi

          xcodebuild "${XC_ARGS[@]}" -list

          WORK="$RUNNER_TEMP/galaxy-unsigned-ios"
          ARCHIVE="$WORK/Unity-iPhone-unsigned.xcarchive"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # build settings are intentionally after the archive action.
          xcodebuild "${XC_ARGS[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$WORK/DerivedData" \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN_VERSION"

          APP_SRC="$(find "$ARCHIVE/Products/Applications" -type d -name '*.app' -print -quit 2>/dev/null)"
          if [ -z "$APP_SRC" ]; then
            echo "::error::No .app found in the unsigned archive"
            find "$ARCHIVE" -maxdepth 4 -print || true
            exit 1
          fi

          APP_NAME="$(basename "$APP_SRC")"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP_SRC/Info.plist")"
          plutil -lint "$APP_SRC/Info.plist"
          ACTUAL_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP_SRC/Info.plist")"
          MIN_IOS="$(plutil -extract MinimumOSVersion raw -o - "$APP_SRC/Info.plist")"

          if [ "$ACTUAL_ID" != "$BUNDLE_ID" ]; then
            echo "::error::Unexpected bundle id: $ACTUAL_ID (expected $BUNDLE_ID)"
            exit 1
          fi
          if [ ! -f "$APP_SRC/$EXECUTABLE" ]; then
            echo "::error::Executable $EXECUTABLE is missing from $APP_SRC"
            exit 1
          fi

          ARCHS="$(lipo -archs "$APP_SRC/$EXECUTABLE")"
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::Executable architecture must be arm64, got: $ARCHS"
            exit 1
          fi
          if [ "$MIN_IOS" != "$IOS_MIN_VERSION" ]; then
            echo "::error::MinimumOSVersion must be $IOS_MIN_VERSION, got: $MIN_IOS"
            exit 1
          fi

          file "$APP_SRC/$EXECUTABLE"
          otool -l "$APP_SRC/$EXECUTABLE" | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true

          CS_LOG="$WORK/codesign.log"
          if codesign --verify --deep --strict --verbose=2 "$APP_SRC" >"$CS_LOG" 2>&1; then
            echo "::error::The .app is signed; this job must produce an unsigned IPA"
            cat "$CS_LOG"
            exit 1
          fi
          if ! grep -Eqi 'not signed|code object is not signed' "$CS_LOG"; then
            echo "::error::Could not prove the .app is unsigned"
            cat "$CS_LOG"
            exit 1
          fi
          if [ -e "$APP_SRC/_CodeSignature/CodeResources" ]; then
            echo "::error::Ad-hoc signature detected (_CodeSignature/CodeResources)"
            exit 1
          fi
          PROFILE="$(find "$APP_SRC" -name 'embedded.mobileprovision' -print -quit 2>/dev/null)"
          if [ -n "$PROFILE" ]; then
            echo "::error::Provisioning profile found inside the .app: $PROFILE"
            exit 1
          fi

          STAGE="$WORK/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          export COPYFILE_DISABLE=1
          cp -Rp "$APP_SRC" "$STAGE/Payload/$APP_NAME"

          IPA="$GITHUB_WORKSPACE/unity/build/GalaxyiOS/${IOS_IPA}"
          rm -f "$IPA"
          (cd "$STAGE" && zip -q -r -y -X "$IPA" Payload)

          unzip -tq "$IPA" >/dev/null
          ROOTS="$(unzip -Z1 "$IPA" | awk -F/ '{print $1}' | sort -u)"
          if [ "$ROOTS" != "Payload" ]; then
            echo "::error::Unexpected IPA roots: $ROOTS"
            exit 1
          fi
          VERIFY="$WORK/verify"
          mkdir -p "$VERIFY"
          unzip -q "$IPA" -d "$VERIFY"
          plutil -lint "$VERIFY/Payload/$APP_NAME/Info.plist"
          IPA_ENTRIES="$(unzip -Z1 "$IPA")"
          while IFS= read -r entry; do
            if [[ "$entry" == */embedded.mobileprovision ]]; then
              echo "::error::IPA contains embedded.mobileprovision: $entry"
              exit 1
            fi
          done <<< "$IPA_ENTRIES"

          {
            echo "### iOS unsigned IPA"
            echo "- App: $APP_NAME"
            echo "- Bundle id: $ACTUAL_ID"
            echo "- Minimum iOS: $MIN_IOS"
            echo "- Architectures: $ARCHS"
            echo "- Signature: unsigned"
            echo "- IPA: $IPA"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Unsigned IPA verified: $IPA"
          ls -lh "$IPA"
          shasum -a 256 "$IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: orbita-galaxy-ios-unsigned
          path: unity/build/GalaxyiOS/${{ env.IOS_IPA }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish ORBITA Galaxy binaries
    if: always() && (startsWith(github.ref, 'refs/tags/g') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: [credentials, tests, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify all build jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.credentials.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
          test "${{ needs.ios.result }}" = "success"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          case "$TAG" in
            g[0-9]*) echo "tag=$TAG" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Release tag must start with g (got '$TAG')"; exit 1 ;;
          esac

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: orbita-galaxy-android
          path: dist/galaxy

      - name: Download iOS unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: orbita-galaxy-ios-unsigned
          path: dist/galaxy

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/galaxy/${ANDROID_APK}"
          IPA="dist/galaxy/${IOS_IPA}"
          test -s "$APK"
          test -s "$IPA"
          unzip -tq "$APK"
          unzip -tq "$IPA"
          ls -lh "$APK" "$IPA"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ORBITA Galaxy ${{ steps.tag.outputs.tag }}"
          body: |
            ORBITA GALAXY — одиночная offline .io-арена на Unity 2022.3.62f1
            (последняя публичная 2022.3 LTS для Personal; 2022.3.74f1 — Extended LTS).

            - `OrbitaGalaxy-Android.apk` — ARM64 APK для установки и тестирования (debug-подпись Unity).
            - `OrbitaGalaxy-iOS-Unsigned.ipa` — неподписанный IPA в структуре `Payload/*.app`; подпиши его своим сертификатом перед установкой.

            Bundle id: `com.orbit.galaxy`, версия `4.1.0` (build `4100`).
            Старые ветки, workflow и релизы `v*` / `u*` не затрагиваются.
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/galaxy/OrbitaGalaxy-Android.apk
            dist/galaxy/OrbitaGalaxy-iOS-Unsigned.ipa
