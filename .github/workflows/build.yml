name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest runner ships with the Android SDK preinstalled.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          cd ios
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Unsigned device build: sideloading tools (AltStore, Sideloadly) re-sign it
      # with the user's own Apple ID, so no developer account is needed here.
      - name: Build unsigned device app
        run: |
          cd ios
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Orbit.app build/Payload/
          cd build
          zip -qry Orbit-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: orbita-unsigned-ipa
          path: ios/build/Orbit-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: orbita-debug-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: orbita-unsigned-ipa
          path: dist

      - name: Rename artifacts
        run: |
          cd dist
          mv app-debug.apk "orbita-${GITHUB_REF_NAME}-debug.apk"
          mv Orbit-unsigned.ipa "orbita-${GITHUB_REF_NAME}-unsigned.ipa"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Орбита ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.ipa
