name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  TARGET_SIZE_MB: 512

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          normalize() { node -e 'const p=process.argv[1].split("."); while(p.length<3)p.push("0"); console.log(p.join("."))' "$1"; }
          TAG=$(normalize "${GITHUB_REF_NAME#v}")
          PKG=$(normalize "$(node -p "require('./package.json').version")")
          ANDROID=$(normalize "$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | cut -d'"' -f2)")
          IOS=$(normalize "$(grep -oE 'MARKETING_VERSION = [^;]+' ios/App/App.xcodeproj/project.pbxproj | head -1 | sed 's/.*= //;s/;//')")
          echo "tag=$TAG package=$PKG android=$ANDROID ios=$IOS"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$ANDROID" ] || [ "$TAG" != "$IOS" ]; then
            echo "::error::Версия тега не совпадает с версией приложения"
            exit 1
          fi

  android:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web core
        run: pnpm run build

      - name: Sync Capacitor
        run: pnpm exec cap sync

      - name: Asset checksum and platform parity
        run: |
          python3 tools/resource_checksum.py
          python3 tools/parity_report.py

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Size budget
        run: python3 tools/size_budget.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbita-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    needs: [verify]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web core
        run: pnpm run build

      - name: Sync Capacitor (iOS)
        run: pnpm exec cap sync ios

      - name: Build unsigned device app
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/Orbit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/Orbit.app
          cd build
          zip -qry Orbit-unsigned.ipa Payload

      - name: Size budget
        run: python3 tools/size_budget.py ios/App/build/Orbit-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: orbita-unsigned-ipa
          path: ios/App/build/Orbit-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          parts = os.environ['GITHUB_REF_NAME'].lstrip('v').split('.')
          ver = '.'.join((parts + ['0', '0'])[:3])
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          open('release-notes.md', 'w', encoding='utf-8').write(
              m.group(0) if m else f'Орбита {ver}\n')
          PY

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: orbita-debug-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: orbita-unsigned-ipa
          path: dist

      - name: Rename artifacts
        run: |
          cd dist
          mv app-debug.apk "orbita-${GITHUB_REF_NAME}-debug.apk"
          mv Orbit-unsigned.ipa "orbita-${GITHUB_REF_NAME}-unsigned.ipa"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Орбита ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.ipa
