name: Unity Core Tests

on:
  push:
    branches:
      - unity-main
    tags:
      - "u*"
    paths:
      - "unity/**"
      - ".github/workflows/unity-core.yml"
  pull_request:
    paths:
      - "unity/**"
      - ".github/workflows/unity-core.yml"

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run pure C# core tests
        run: dotnet test unity/Tests/Orbit.Core.Tests.csproj --configuration Release --nologo
