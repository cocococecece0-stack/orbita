name: Orbit
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "3.8"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orbit
        PRODUCT_NAME: Orbit
        INFOPLIST_FILE: Orbit/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
